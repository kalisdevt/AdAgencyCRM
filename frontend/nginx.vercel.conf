server {
  # Vercel направляет трафик на порт 80 контейнера
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Маршруты одностраничного приложения отдает index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Имена файлов сборки содержат хеш, поэтому их можно кешировать надолго
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
