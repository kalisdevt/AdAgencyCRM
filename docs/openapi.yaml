openapi: 3.0.3
info:
  title: CRM-Агентство — REST API
  version: 0.2.0
  description: >
    Маршруты этапа «Основная функциональность»: лиды и сделки, задачи и файлы, уведомления,
    счета и проекты, личный кабинет клиента, отчеты и справочники. Все маршруты, кроме входа,
    веб-формы и вебхука Telegram, требуют заголовок `Authorization: Bearer <token>`.
servers:
  - url: http://localhost:8080/api
    description: Docker Compose
  - url: http://localhost:3000/api
    description: Локальная разработка
tags:
  - name: Служебные
  - name: Аутентификация
  - name: Пользователи
  - name: Каналы
  - name: Входящие
  - name: Сделки
  - name: Клиенты
  - name: Задачи
  - name: Уведомления
  - name: Счета
  - name: Проекты
  - name: Личный кабинет
  - name: Отчеты
  - name: Справочники

paths:
  /health:
    get:
      tags: [Служебные]
      summary: Проверка работоспособности сервера и БД
      security: []
      responses:
        '200':
          description: Сервер и база данных доступны
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
                  time: { type: string, format: date-time }

  /auth/login:
    post:
      tags: [Аутентификация]
      summary: Вход по логину (или рабочей почте) и паролю
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, example: manager }
                password: { type: string, format: password }
      responses:
        '200':
          description: Токен доступа и профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Аутентификация]
      summary: Профиль текущего пользователя
      responses:
        '200':
          description: Профиль
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users:
    get:
      tags: [Пользователи]
      summary: Список учетных записей (администратор)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Пользователи]
      summary: Создать учетную запись (администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, fullName, password, role]
              properties:
                login: { type: string, pattern: '^[a-zA-Z0-9._-]{3,40}$' }
                email: { type: string, format: email, nullable: true }
                fullName: { type: string, minLength: 2, maxLength: 120 }
                password: { type: string, minLength: 8, maxLength: 72 }
                role: { $ref: '#/components/schemas/Role' }
                clientId: { type: integer, nullable: true, description: Обязателен для роли client }
      responses:
        '201':
          description: Учетная запись создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Логин или почта уже заняты
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{id}:
    patch:
      tags: [Пользователи]
      summary: Изменить роль, данные, пароль или заблокировать учетную запись (администратор)
      description: Администратор не может заблокировать себя или изменить собственную роль.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                email: { type: string, format: email, nullable: true }
                password: { type: string, minLength: 8 }
                role: { $ref: '#/components/schemas/Role' }
                clientId: { type: integer, nullable: true }
                isActive: { type: boolean }
      responses:
        '200':
          description: Обновленная учетная запись
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/roles:
    get:
      tags: [Пользователи]
      summary: Справочник ролей (администратор)
      responses:
        '200':
          description: Роли
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: '#/components/schemas/Role' }
                        name: { type: string }

  /users/assignable:
    get:
      tags: [Пользователи]
      summary: Сотрудники, которых можно назначить ответственными
      description: Доступно ролям admin, manager, sales_head.
      responses:
        '200':
          description: Действующие менеджеры и руководители продаж
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/UserRef' }

  /public/leads:
    post:
      tags: [Каналы]
      summary: Заявка с веб-формы сайта (FR-LEAD-01)
      description: >
        Открытый маршрут. Находит клиента по телефону или e-mail либо создает нового,
        создает лид и сохраняет сообщение. Повтор с тем же `requestId` дубликат не создает.
        Ограничение — 20 заявок в минуту с одного адреса.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              description: Обязателен хотя бы один контакт — phone или email.
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                phone: { type: string, example: '+7 900 000-00-00' }
                email: { type: string, format: email }
                message: { type: string, maxLength: 2000 }
                utm_source: { type: string }
                utm_medium: { type: string }
                utm_campaign: { type: string }
                requestId: { type: string, pattern: '^[A-Za-z0-9-]{8,64}$', description: Ключ идемпотентности }
      responses:
        '201':
          description: Заявка принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadAccepted' }
        '200':
          description: Повторная отправка — заявка уже была принята
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadAccepted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Слишком много заявок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /channels/telegram/webhook:
    post:
      tags: [Каналы]
      summary: Вебхук Telegram Bot API (FR-LEAD-01)
      description: >
        Принимает объект Update. Обращением считается сообщение из личного чата;
        `/start`, сообщения ботов и групповые чаты игнорируются. Повторная доставка
        сообщения с тем же ID не создает дубликат.
      security: []
      parameters:
        - in: header
          name: X-Telegram-Bot-Api-Secret-Token
          required: true
          schema: { type: string }
          description: Значение TELEGRAM_WEBHOOK_SECRET
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Telegram Update }
      responses:
        '200':
          description: Обновление обработано
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  duplicate: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }

  /inbox:
    get:
      tags: [Входящие]
      summary: Лента «Входящие» (FR-LEAD-03)
      description: Доступно ролям admin, manager, sales_head. До 200 обращений, новые сверху.
      parameters:
        - in: query
          name: channel
          schema: { type: string, enum: [telegram, web, vk] }
        - in: query
          name: stage
          schema: { $ref: '#/components/schemas/Stage' }
        - in: query
          name: assignee
          schema: { type: string }
          description: '`me` — мои, `none` — без ответственного, либо ID сотрудника'
        - in: query
          name: unread
          schema: { type: string, enum: ['1', 'true'] }
          description: Только с непрочитанными сообщениями
      responses:
        '200':
          description: Обращения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Deal' }
                  unreadTotal: { type: integer, description: Число обращений с непрочитанными сообщениями }
        '400': { $ref: '#/components/responses/ValidationError' }

  /deals/stages:
    get:
      tags: [Сделки]
      summary: Стадии воронки продаж (FR-DEAL-01)
      responses:
        '200':
          description: Стадии в порядке прохождения
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { $ref: '#/components/schemas/Stage' }
                        name: { type: string }

  /deals/refusal-reasons:
    get:
      tags: [Сделки]
      summary: Справочник причин отказа
      responses:
        '200':
          description: Активные причины
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }

  /deals/{id}:
    get:
      tags: [Сделки]
      summary: Сделка с перепиской
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Сделка, сообщения и контакты клиента
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal: { $ref: '#/components/schemas/Deal' }
                  messages:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  contacts:
                    type: array
                    items: { $ref: '#/components/schemas/Contact' }
                  replyUnavailableReason:
                    type: string
                    nullable: true
                    description: Почему нельзя ответить из системы; null — ответ доступен
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Сделки]
      summary: Сменить стадию, ответственного или сумму (FR-DEAL-01, 03; FR-LEAD-07)
      description: >
        Для стадии `refused` обязательна причина отказа из справочника. Стадии `invoiced` и `paid`
        ставятся через счета: `paid` вручную недоступна, `invoiced` — только при неоплаченном счете;
        стадию оплаченной сделки изменить нельзя.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                stage: { $ref: '#/components/schemas/Stage' }
                refusalReasonId: { type: integer }
                refusalComment: { type: string, nullable: true, maxLength: 1000 }
                assigneeId: { type: integer, nullable: true, description: null снимает ответственного }
                amount: { type: number, minimum: 0 }
                campaignId: { type: integer, nullable: true, description: Рекламная кампания (FR-DEAL-02) }
                title: { type: string, minLength: 2, maxLength: 200 }
      responses:
        '200':
          description: Обновленная сделка
          content:
            application/json:
              schema:
                type: object
                properties:
                  deal: { $ref: '#/components/schemas/Deal' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deals/{id}/read:
    post:
      tags: [Сделки]
      summary: Отметить входящие сообщения сделки прочитанными
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Отмечено }
        '404': { $ref: '#/components/responses/NotFound' }

  /deals/{id}/messages:
    post:
      tags: [Сделки]
      summary: Ответить клиенту в канал обращения (FR-LEAD-06)
      description: >
        Сообщение сначала отправляется во внешний канал и сохраняется только после
        успешной отправки.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Сообщение отправлено и сохранено
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: Канал не поддерживает ответ или у клиента нет контакта в канале
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Внешний канал отклонил сообщение
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Канал не подключен на сервере
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /clients/{id}:
    get:
      tags: [Клиенты]
      summary: Карточка клиента (FR-LEAD-05)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Контакты, сделки, проекты и история сообщений
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCard' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Клиенты]
      summary: Изменить данные клиента
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                phone: { type: string, nullable: true }
                email: { type: string, format: email, nullable: true }
                company: { type: string, nullable: true }
                inn: { type: string, nullable: true, description: 10 или 12 цифр }
                address: { type: string, nullable: true }
                note: { type: string, nullable: true }
      responses:
        '200':
          description: Обновленная карточка
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCard' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /clients/{id}/account:
    post:
      tags: [Клиенты]
      summary: Создать учетную запись клиента для личного кабинета (FR-PORT-01)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login: { type: string, pattern: '^[a-zA-Z0-9._-]{3,40}$' }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '201':
          description: Карточка клиента с учетной записью в `portalAccounts`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCard' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Логин занят }
  /clients/{id}/account/{userId}:
    patch:
      tags: [Клиенты]
      summary: Заблокировать, разблокировать учетную запись клиента или сменить пароль
      parameters:
        - $ref: '#/components/parameters/Id'
        - { in: path, name: userId, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isActive: { type: boolean }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        '200':
          description: Обновленная карточка клиента
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientCard' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/staff:
    get:
      tags: [Пользователи]
      summary: Действующие сотрудники — исполнители задач (FR-TASK-01)
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/UserRef' } }

  /tasks:
    get:
      tags: [Задачи]
      summary: Список задач
      description: Дизайнер и маркетолог видят только задачи, где они исполнитель или постановщик; руководящие роли с `scope=all` — все.
      parameters:
        - { in: query, name: scope, schema: { type: string, enum: [mine, all] } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/TaskStatus' } }
        - { in: query, name: dealId, schema: { type: integer } }
        - { in: query, name: open, schema: { type: string, enum: ['1'] }, description: Только незавершенные }
      responses:
        '200':
          description: Задачи с файлами
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
    post:
      tags: [Задачи]
      summary: Создать задачу из сделки (FR-TASK-01); исполнитель получает уведомление (FR-TASK-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealId, title, assigneeId]
              properties:
                dealId: { type: integer }
                title: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, nullable: true, maxLength: 5000 }
                assigneeId: { type: integer }
                dueDate: { type: string, format: date, nullable: true }
      responses:
        '201':
          description: Созданная задача
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}:
    get:
      tags: [Задачи]
      summary: Карточка задачи с комментариями
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                type: object
                properties:
                  task: { $ref: '#/components/schemas/Task' }
                  comments:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        text: { type: string }
                        author: { $ref: '#/components/schemas/UserRef' }
                        createdAt: { type: string, format: date-time }
                  canEdit: { type: boolean, description: Может менять содержание задачи }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Задачи]
      summary: Изменить статус (исполнитель) или содержание задачи (постановщик, отдел продаж) — FR-TASK-03
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { $ref: '#/components/schemas/TaskStatus' }
                title: { type: string }
                description: { type: string, nullable: true }
                assigneeId: { type: integer }
                dueDate: { type: string, format: date, nullable: true }
      responses:
        '200': { description: Обновленная задача }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tasks/{id}/comments:
    post:
      tags: [Задачи]
      summary: Комментарий к задаче; второй участник получает уведомление
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201': { description: Созданный комментарий }
  /tasks/{id}/files:
    post:
      tags: [Задачи]
      summary: Загрузить макет или вложение (FR-TASK-03)
      description: >
        Тело запроса — содержимое файла как есть, имя файла — в заголовке `X-File-Name`
        (encodeURIComponent). Тип определяется сервером по расширению из белого списка; предел — `MAX_UPLOAD_MB`.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { in: header, name: X-File-Name, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Метаданные файла
          content:
            application/json:
              schema:
                type: object
                properties:
                  file: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '413': { description: Файл слишком большой }
  /files/{id}:
    get:
      tags: [Задачи]
      summary: Получить файл (участникам задачи и руководящим ролям)
      parameters:
        - $ref: '#/components/parameters/Id'
        - { in: query, name: download, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: Содержимое файла
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [Уведомления]
      summary: Уведомления текущего пользователя (FR-TASK-02)
      responses:
        '200':
          description: Последние 100 и число непрочитанных
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unread: { type: integer }
  /notifications/unread-count:
    get:
      tags: [Уведомления]
      summary: Число непрочитанных уведомлений
      responses:
        '200': { description: 'Объект вида { "unread": 2 }' }
  /notifications/{id}/read:
    post:
      tags: [Уведомления]
      summary: Отметить уведомление прочитанным
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Отмечено }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications/read-all:
    post:
      tags: [Уведомления]
      summary: Отметить все уведомления прочитанными
      responses:
        '204': { description: Отмечено }

  /invoices:
    get:
      tags: [Счета]
      summary: Счета сделки
      parameters:
        - { in: query, name: dealId, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Список
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
    post:
      tags: [Счета]
      summary: Сформировать счет в PDF на сумму сделки (FR-DOC-01)
      description: Сделка переходит в «Счет выставлен». Нельзя для сделки без суммы, в «Отказе» или оплаченной.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dealId]
              properties:
                dealId: { type: integer }
                description: { type: string, nullable: true, maxLength: 500, description: Наименование услуги в счете }
      responses:
        '201':
          description: Счет
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /invoices/{id}:
    patch:
      tags: [Счета]
      summary: Отметить оплату (FR-DOC-02) — сделка переходит в «Оплачено», создается проект (FR-PROJ-01)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, paid] }
      responses:
        '200':
          description: Счет и признак создания проекта
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoice: { $ref: '#/components/schemas/Invoice' }
                  projectCreated: { type: boolean }
        '409': { description: Оплаченный счет нельзя вернуть в «Ожидает оплаты» }
  /invoices/{id}/pdf:
    get:
      tags: [Счета]
      summary: PDF счета
      parameters:
        - $ref: '#/components/parameters/Id'
        - { in: query, name: download, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /invoices/{id}/send:
    post:
      tags: [Счета]
      summary: Отправить PDF счета клиенту в Telegram (FR-DOC-03)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Счет с заполненным `sentAt` }
        '422': { description: Бот не подключен или клиент не писал боту }

  /projects:
    get:
      tags: [Проекты]
      summary: Панель статусов проектов (FR-PROJ-02)
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [active, completed] } }
        - { in: query, name: manager, schema: { type: string, enum: [me] } }
      responses:
        '200':
          description: Проекты и сводка по этапам (по всем проектам)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  summary:
                    type: object
                    additionalProperties: { type: integer }
                    example: { design: 1, approval: 0, printing: 2, placement: 0, completed: 3 }
  /projects/{id}:
    get:
      tags: [Проекты]
      summary: Проект с этапами и счетами
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Проект
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
                  canMarkStages: { type: boolean }
  /projects/{id}/stages/{code}:
    post:
      tags: [Проекты]
      summary: Отметить выполнение этапа (FR-PROJ-01) и уведомить клиента (FR-PROJ-03)
      description: Этапы отмечаются по порядку; отменить можно только последний выполненный. Отмечает ответственный менеджер, руководитель отдела продаж или администратор.
      parameters:
        - $ref: '#/components/parameters/Id'
        - { in: path, name: code, required: true, schema: { type: string, enum: [design, approval, printing, placement, completed] } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
                notifyClient: { type: boolean, default: true }
      responses:
        '200':
          description: Проект и результат уведомления клиента
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
                  clientNotification:
                    type: object
                    nullable: true
                    properties:
                      sent: { type: boolean }
                      reason: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /portal:
    get:
      tags: [Личный кабинет]
      summary: Заказы клиента (FR-PORT-01, 02) — только для роли «Клиент»
      responses:
        '200':
          description: Текущие заказы, проекты в работе, архив, счета
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    type: object
                    properties:
                      name: { type: string }
                      company: { type: string, nullable: true }
                  orders:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        status: { type: string, example: Готовим предложение }
                        amount: { type: number }
                        createdAt: { type: string, format: date-time }
                  activeProjects: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  archive: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  invoices: { type: array, items: { $ref: '#/components/schemas/Invoice' } }
  /portal/projects/{id}:
    get:
      tags: [Личный кабинет]
      summary: Проект клиента (чужой — 404)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { description: Проект }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/invoices/{id}/pdf:
    get:
      tags: [Личный кабинет]
      summary: PDF счета клиента (чужой — 404)
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /reports:
    get:
      tags: [Отчеты]
      summary: Отчеты, доступные текущей роли, и период по умолчанию
      responses:
        '200': { description: 'Объект вида { "reports": ["channels", "refusals"], "canEditExpenses": true, "period": { "from": "2026-11-01", "to": "2026-11-17" } }' }
  /reports/{type}:
    get:
      tags: [Отчеты]
      summary: Отчет за период (FR-AN-01, 03, 04, 05)
      description: >
        `channels` — каналы и кампании с расходами и стоимостью привлечения (FR-AN-01, 02);
        `refusals` — причины отказа (FR-AN-03); `managers` — KPI менеджеров (FR-AN-04);
        `revenue` — ожидаемая выручка по стадиям, без учета периода (FR-AN-05).
        Маркетологу доступны `channels` и `refusals`; руководителю отдела продаж, директору и администратору — все.
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [channels, refusals, managers, revenue] } }
        - { in: query, name: from, schema: { type: string, format: date }, description: По умолчанию — начало текущего месяца }
        - { in: query, name: to, schema: { type: string, format: date }, description: По умолчанию — сегодня }
      responses:
        '200': { description: Данные отчета }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reports/{type}/csv:
    get:
      tags: [Отчеты]
      summary: Выгрузка отчета в CSV для Excel (FR-AN-07)
      parameters:
        - { in: path, name: type, required: true, schema: { type: string, enum: [channels, refusals, managers, revenue] } }
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200':
          description: CSV (UTF-8 с BOM, разделитель «;»)
          content:
            text/csv:
              schema: { type: string }
  /reports/expenses:
    get:
      tags: [Отчеты]
      summary: Расходы на кампании за период (FR-AN-02)
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
      responses:
        '200': { description: Список расходов }
    post:
      tags: [Отчеты]
      summary: Добавить расход (маркетолог, администратор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campaignId, spentOn, amount]
              properties:
                campaignId: { type: integer }
                spentOn: { type: string, format: date }
                amount: { type: number, minimum: 0, exclusiveMinimum: true }
                comment: { type: string, nullable: true, maxLength: 500 }
      responses:
        '201': { description: Создан }
        '400': { $ref: '#/components/responses/ValidationError' }
  /reports/expenses/{id}:
    delete:
      tags: [Отчеты]
      summary: Удалить расход
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Удален }

  /dictionaries/refusal-reasons:
    get:
      tags: [Справочники]
      summary: Причины отказа, включая скрытые (администратор, FR-ADM-02)
      responses:
        '200': { description: Список }
    post:
      tags: [Справочники]
      summary: Добавить причину отказа
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '201': { description: Создана }
        '409': { description: Такая причина уже есть }
  /dictionaries/refusal-reasons/{id}:
    patch:
      tags: [Справочники]
      summary: Переименовать или скрыть причину отказа
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Обновлена }
  /dictionaries/campaigns:
    get:
      tags: [Справочники]
      summary: Рекламные кампании (для выбора в сделке и отчетов)
      responses:
        '200': { description: Список }
    post:
      tags: [Справочники]
      summary: Добавить кампанию (администратор, маркетолог)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name]
              properties:
                code: { type: string, description: Значение utm_campaign }
                name: { type: string }
      responses:
        '201': { description: Создана }
        '409': { description: Кампания с таким кодом уже есть }
  /dictionaries/campaigns/{id}:
    patch:
      tags: [Справочники]
      summary: Переименовать или скрыть кампанию
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Обновлена }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer }
  responses:
    ValidationError:
      description: Некорректные входные данные
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Нет токена, токен недействителен или учетная запись заблокирована
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Запись не найдена
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_error }
            message: { type: string, example: Укажите телефон или почту для связи }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
    Role:
      type: string
      enum: [admin, manager, designer, marketer, sales_head, director, client]
    Stage:
      type: string
      enum: [new, qualification, proposal_prep, proposal_sent, invoiced, paid, refused]
    UserRef:
      type: object
      properties:
        id: { type: integer }
        fullName: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        login: { type: string }
        email: { type: string, nullable: true }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        roleName: { type: string }
        clientId: { type: integer, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    LeadAccepted:
      type: object
      properties:
        accepted: { type: boolean }
        duplicate: { type: boolean }
        message: { type: string }
    Contact:
      type: object
      properties:
        channel: { type: string, enum: [telegram, web, vk] }
        externalId: { type: string }
        username: { type: string, nullable: true }
        displayName: { type: string, nullable: true }
    Message:
      type: object
      properties:
        id: { type: integer }
        dealId: { type: integer }
        channel: { type: string }
        direction: { type: string, enum: [in, out] }
        text: { type: string }
        author:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    Deal:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        stage: { $ref: '#/components/schemas/Stage' }
        amount: { type: number }
        channel: { type: string, enum: [telegram, web, vk, manual] }
        utm:
          type: object
          properties:
            source: { type: string, nullable: true }
            medium: { type: string, nullable: true }
            campaign: { type: string, nullable: true }
        campaign: { type: string, nullable: true }
        refusalReasonId: { type: integer, nullable: true }
        refusalReason: { type: string, nullable: true }
        refusalComment: { type: string, nullable: true }
        firstResponseAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        client:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            isReturning: { type: boolean, description: У клиента есть другие сделки }
        assignee:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        lastMessage:
          type: object
          nullable: true
          properties:
            text: { type: string }
            direction: { type: string, enum: [in, out] }
            createdAt: { type: string, format: date-time }
        unread: { type: integer }
        campaignId: { type: integer, nullable: true }
        projectId: { type: integer, nullable: true, description: Проект, созданный после оплаты }
        pendingInvoices: { type: integer, description: Неоплаченные счета }
    ClientCard:
      type: object
      properties:
        client:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            phone: { type: string, nullable: true }
            email: { type: string, nullable: true }
            company: { type: string, nullable: true }
            note: { type: string, nullable: true }
            createdAt: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/Contact' }
        deals:
          type: array
          items: { $ref: '#/components/schemas/Deal' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }
        projects:
          type: array
          items: { $ref: '#/components/schemas/Project' }
        portalAccounts:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              login: { type: string }
              isActive: { type: boolean }
    TaskStatus:
      type: string
      enum: [new, in_progress, review, done]
      description: Новая, В работе, На согласовании, Готово
    File:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        isPreviewable: { type: boolean, description: Изображение, которое можно показать миниатюрой }
        uploadedBy:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        taskId: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    Task:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
        dueDate: { type: string, format: date, nullable: true }
        isOverdue: { type: boolean }
        assignee: { $ref: '#/components/schemas/UserRef' }
        author: { $ref: '#/components/schemas/UserRef' }
        deal:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
            stage: { $ref: '#/components/schemas/Stage' }
        client:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
        commentCount: { type: integer }
        files: { type: array, items: { $ref: '#/components/schemas/File' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [task_assigned, task_comment, task_file, task_status, project_created] }
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true, example: /tasks/12 }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    Invoice:
      type: object
      properties:
        id: { type: integer }
        number: { type: string, example: СЧ-2026-0001 }
        amount: { type: number }
        status: { type: string, enum: [pending, paid] }
        description: { type: string }
        fileId: { type: integer }
        issuedAt: { type: string, format: date-time }
        paidAt: { type: string, format: date-time, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        deal:
          type: object
          properties:
            id: { type: integer }
            title: { type: string }
        projectId: { type: integer, nullable: true }
    Project:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        status: { type: string, enum: [active, completed] }
        manager:
          allOf: [{ $ref: '#/components/schemas/UserRef' }]
          nullable: true
        client:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            company: { type: string, nullable: true }
        deal:
          type: object
          properties:
            id: { type: integer }
            amount: { type: number }
            channel: { type: string }
        stages:
          type: array
          items:
            type: object
            properties:
              code: { type: string, enum: [design, approval, printing, placement, completed] }
              name: { type: string }
              isDone: { type: boolean }
              doneAt: { type: string, format: date-time, nullable: true }
        currentStage:
          type: object
          nullable: true
          properties:
            code: { type: string }
            name: { type: string }
        progress:
          type: object
          properties:
            done: { type: integer }
            total: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
