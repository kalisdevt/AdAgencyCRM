# ИИ-ревью pull request: Claude читает изменения и оставляет замечания
# комментариями к строкам. Настройка — docs/pull-requests.md.
name: AI review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: AI review (Claude)
    # Черновики не проверяем; для pull request из форков GitHub не выдает секреты
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # публикация итогового комментария и замечаний к строкам
      pull-requests: write
      issues: read
      # нужно действию для входа от имени GitHub-приложения Claude
      id-token: write
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      # Задание не должно быть зеленым, если ревью не было: без токена сразу ошибка
      - name: Проверить, что ревью настроено
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::ИИ-ревью не настроено: не задан секрет CLAUDE_CODE_OAUTH_TOKEN. См. docs/pull-requests.md"
            exit 1
          fi
      # Время начала: проверка в конце учитывает только комментарии этого запуска
      - name: Запомнить время начала ревью
        run: echo "REVIEW_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@7806b44efdf0782087085511dc7e5cdd6de05b9d # v1.0.248
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Ревью по рецепту из документации действия (docs/solutions.md): явная инструкция и только
          # нужные инструменты. Раньше использовался плагин code-review, но его команде нужны субагенты
          # и вызовы gh, которые не были разрешены, — Claude завершался, ничего не опубликовав.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Проведи код-ревью этого pull request. Ветка pull request уже выгружена в рабочий каталог.
            Пиши на русском языке.

            Порядок работы:
            1. Прочитай описание и уже оставленные комментарии: `gh pr view ${{ github.event.pull_request.number }} --comments`.
               Не повторяй замечания, которые уже есть.
            2. Получи изменения: `gh pr diff ${{ github.event.pull_request.number }}`. Чтобы проверить замечание,
               читай файлы проекта (Read, Grep, Glob); правила проекта — в AGENTS.md и README.md, если они есть.
            3. Ищи только существенные проблемы во внесенных изменениях: ошибки, из-за которых код не запустится
               или даст неверный результат, уязвимости (обход проверки прав, инъекции, утечка данных),
               потерю данных, нарушение требований из описания pull request.
               Не отмечай стиль, вкусовые предложения, то, что поймает линтер, и проблемы, которых не было
               в этом pull request. Если не уверен, что проблема реальна, — не пиши о ней.
            4. Каждую подтвержденную проблему опубликуй отдельным замечанием к строке через
               `mcp__github_inline_comment__create_inline_comment` с `confirmed: true`: коротко суть,
               почему это ошибка и как исправить (для небольшого исправления — блок suggestion).
            5. В конце обязательно опубликуй один итоговый комментарий через `gh pr comment ${{ github.event.pull_request.number }} --body "..."`,
               начинающийся с заголовка «## ИИ-ревью»: что проверено и сколько замечаний оставлено,
               либо «Существенных замечаний нет».
            Публикуй результат только комментариями в GitHub — не отвечай текстом в журнал.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Read,Grep,Glob"
      # Действие завершается успешно, даже когда пропустило ревью, поэтому результат проверяем сами:
      # за время этого запуска Claude должен оставить в pull request хотя бы один комментарий.
      - name: Убедиться, что ревью опубликовано
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          # $2 — поле с датой: created_at у комментариев, submitted_at у ревью
          count_by_claude() {
            gh api --paginate "repos/$REPO/$1" \
              --jq ".[] | select(.user.login | test(\"^claude(\\\\[bot\\\\])?$\")) | select(.$2 >= env.REVIEW_STARTED_AT) | .id" | wc -l
          }
          comments=$(( $(count_by_claude "issues/$PR/comments" created_at) + $(count_by_claude "pulls/$PR/comments" created_at) + $(count_by_claude "pulls/$PR/reviews" submitted_at) ))

          if [ "$comments" -gt 0 ]; then
            echo "Ревью опубликовано: новых комментариев Claude — $comments." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Действие отказывается работать, если pull request меняет сам файл workflow
          # (он должен совпадать с версией в master) — это единственное допустимое исключение.
          if gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | grep -qx '.github/workflows/ai-review.yml'; then
            echo "::warning::ИИ-ревью не выполнялось: pull request изменяет ai-review.yml, а действие запускается только с версией файла из master."
            echo "ИИ-ревью не выполнялось: pull request изменяет сам workflow ревью." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "$CLAUDE_CONCLUSION" = "success" ]; then
            echo "::error::Claude отработал, но не опубликовал ревью. Перезапустите задание; если повторяется — включите отладку (Re-run with debug logging) и посмотрите журнал шага выше."
          else
            echo "::error::ИИ-ревью не выполнялось: действие было пропущено. Причина — в предупреждениях (Annotations) этого запуска."
          fi
          exit 1
